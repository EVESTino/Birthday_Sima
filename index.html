<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Небольшой сюрприз ко дню рождения" />
    <title>Для именинницы</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <section class="intro" id="intro" aria-labelledby="intro-title">
      <div class="orbit orbit-one" aria-hidden="true"></div>
      <div class="orbit orbit-two" aria-hidden="true"></div>
      <p class="intro-kicker gradient-text">для тебя кое-что есть</p>
      <h1 class="gradient-text" id="intro-title">маленький сюрприз</h1>
      <button class="hold-button" id="holdButton" type="button" aria-label="Удерживай, чтобы открыть сюрприз">
        <span class="hold-fill" aria-hidden="true"></span>
        <span class="hold-content"><span class="hold-label">открой меня</span></span>
      </button>
      <p class="hold-hint" id="holdHint">нажми и подержи</p>
    </section>

    <main class="surprise" id="surprise" aria-hidden="true">
      <section class="bear-stage" id="bearStage" aria-labelledby="birthdayQuestion">
        <div class="neon-grid" aria-hidden="true"></div>
        <div class="neon-sweep neon-sweep-top" aria-hidden="true"></div>
        <div class="neon-sweep neon-sweep-bottom" aria-hidden="true"></div>
        <div class="bear-scene">
          <div class="bear-video-frame">
            <video id="birthdayVideo" muted loop playsinline preload="metadata" aria-label="Праздничное видео">
              <source src="./assets/birthday-video.mp4" type="video/mp4" />
            </video>
          </div>
        </div>
        <div class="birthday-prompt" id="birthdayPrompt">
          <p class="prompt-label" id="birthdayQuestion">У тебя День Рождения?</p>
          <button class="answer-button" id="answerButton" type="button">У меня!!!</button>
        </div>
      </section>

      <section class="spiral-section" id="spiralSection" aria-hidden="true">
        <canvas class="aurora-canvas" id="auroraCanvas" aria-hidden="true"></canvas>
        <div class="spiral-glow" aria-hidden="true"></div>
        <h2 aria-label="С Днем Рождения">С Днем<br />Рождения</h2>
        <div class="spiral-viewport" id="spiralViewport" aria-label="Карусель с фотографиями">
          <div class="spiral" id="spiral">
            <div class="photo-slot"><img src="./assets/photos/01.jpg" alt="Памятный момент 1" loading="lazy" decoding="async" /></div>
            <div class="photo-slot"><img src="./assets/photos/02.jpg" alt="Памятный момент 2" loading="lazy" decoding="async" /></div>
            <div class="photo-slot"><img src="./assets/photos/03.jpg" alt="Памятный момент 3" loading="lazy" decoding="async" /></div>
            <div class="photo-slot"><img src="./assets/photos/04.jpg" alt="Памятный момент 4" loading="lazy" decoding="async" /></div>
            <div class="photo-slot"><img src="./assets/photos/05.jpg" alt="Памятный момент 5" loading="lazy" decoding="async" /></div>
            <div class="photo-slot"><img src="./assets/photos/06.jpg" alt="Памятный момент 6" loading="lazy" decoding="async" /></div>
            <div class="photo-slot"><img src="./assets/photos/07.jpg" alt="Памятный момент 7" loading="lazy" decoding="async" /></div>
            <div class="photo-slot"><img src="./assets/photos/08.jpg" alt="Памятный момент 8" loading="lazy" decoding="async" /></div>
            <div class="photo-slot"><img src="./assets/photos/09.jpg" alt="Памятный момент 9" loading="lazy" decoding="async" /></div>
            <div class="photo-slot"><img src="./assets/photos/10.jpg" alt="Памятный момент 10" loading="lazy" decoding="async" /></div>
            <div class="photo-slot"><img src="./assets/photos/11.jpg" alt="Памятный момент 11" loading="lazy" decoding="async" /></div>
          </div>
        </div>
        <p class="spiral-hint">ваши любимые моменты</p>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
